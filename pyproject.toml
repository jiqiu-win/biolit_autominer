[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolit_autominer"
version = "1.0.0"
description = "Automated Biomedical Literature Mining Pipeline"
authors = [{name = "Ji Qiu", email = "jq2430@columbia.edu"}]
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = [
    "biopython>=1.83",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "google-cloud-aiplatform>=1.38.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
]
